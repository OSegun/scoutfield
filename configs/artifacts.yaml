# Where every stage's outputs live. Notebooks, the laptop and anyone reading the
# results use this one location, so no stage ever depends on where Kaggle happened to
# mount another stage's output.
hub_repo: OSegun/scoutfield-artifacts
repo_type: dataset
# One identifier per full pipeline run. Change it to start a new, separate run;
# never reuse one.
run_id: r2026-11-13
local_cache: .artifact_cache # gitignored
# Where a stage run on a laptop writes its working files (results/ and figures/
# beneath it), gitignored. The repository's own results/ and figures/ hold one
# promoted run and are written by the promotion step only, so a local run of stages
# 04 to 06 can never overwrite them. On Kaggle stages write to /kaggle/working.
local_work_dir: .artifact_cache/work
# Resumable state is pushed this often so a killed Kaggle session loses at most this much.
push_every_jobs: 25
