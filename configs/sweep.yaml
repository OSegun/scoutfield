# Evaluation sweep. Mirrors the pilot's design so the two are directly comparable.
#
# Statistics follow Agarwal et al. (2021) and Colas et al. (2018, 2019):
# interquartile mean with stratified bootstrap confidence intervals, never
# mean +/- std over three seeds.

seed: 0

# The pilot ships no Spiral agent despite earlier drafts naming one; its
# non-learned baselines are Lawnmower, Random and GreedyEntropy.
agents: [lawnmower, random, greedy_entropy, ppo, oracle]

temperatures: [0.30, 0.50, 1.00, 2.00, 3.00, 4.00]
seeds: [0, 1, 2, 3, 4]

# Which trained PPO policies to evaluate — a different axis from `seeds` above,
# which are EVALUATION seeds (the fields each planner meets).
#
# Evaluating one policy across five evaluation seeds measures that policy; three
# independently trained policies measure the method. The distinction is what a
# reviewer asks about first, so it is stated here rather than inferred, and it is
# recorded in results/sweep_metadata.json with every run.
#
# Every seed listed must have a trained checkpoint (ppo_seed<N>.zip) or the sweep
# fails when it reaches that job.
ppo_train_seeds: [0, 1, 2]

# The experimental condition. `shift` = PlantDoc field imagery, where the
# classifier is overconfident (ECE 0.1376) and the precision-for-recall trade this
# study measures can actually occur. It must match `CALIBRATION_SPLIT` in
# experiments/04_sweep.py, which pairs each row with the measured ECE for the same
# split. See docs/RESULTS.md, section "1. Perception", for why the in-distribution
# split is degenerate here.
pool_split: shift
cluster_sigmas: [0.75, 1.50, 3.00]

# Held at the pilot's prevalence — see the note in configs/ppo_field32.yaml.
n_parents: 18
offspring_mean: 14

eval_episodes: 20

statistics:
  estimator: iqm
  bootstrap_resamples: 10000
  ci: 0.95
  stratify_by: [agent, temperature]

# Resumable, like the pilot's run_jobs.py. Delete results/_done.json to restart
# cleanly — otherwise the driver resumes and silently mixes old and new results.
runner:
  checkpoint_file: results/_done.json
  output_csv: results/sweep_results.csv
  summary_json: results/summary.json
  job_budget: 60          # jobs per process invocation; keeps Kaggle sessions short
