# Perception: fine-tuning and calibration.
# Every value here is read by code. Nothing is duplicated in a .py file.

seed: 0

data:
  # PlantVillage is lab-condition imagery and trains the model.
  # PlantDoc is field imagery and is the held-out distribution-shift test.
  # Never train on PlantDoc — the shift test is the point.
  train_dataset: plantvillage
  shift_dataset: plantdoc
  # Kaggle dataset slugs; resolved by utils/paths.py when running on Kaggle.
  kaggle_slugs:
    plantvillage: abdallahalidev/plantvillage-dataset
    plantdoc: nirmalsankalana/plantdoc-dataset
  image_size: 224
  # PlantVillage ships three renderings of the same photographs side by side:
  # color, grayscale and segmented. Exactly one is used. `color` is the only one
  # matching the RGB field imagery in PlantDoc and the only one consistent with an
  # ImageNet-pretrained backbone; `segmented` removes the background, which is the
  # very cue that fails under shift, so training on it would flatter the model.
  plantvillage_variant: color
  # Binary healthy/diseased, matching the pilot's ScoutEnv label space.
  # PlantDoc names no class "healthy", so the mapping is enumerated explicitly in
  # scoutfield/perception/datasets.py rather than inferred from the directory name.
  binarise: true
  # Two held-out splits from PlantVillage, deliberately separate: `val` fits the
  # temperature (Guo et al., 2017) and `test` carries early stopping and
  # in-distribution reporting. Using one split for both leaks the calibration fit
  # into the stopping decision.
  val_fraction: 0.15
  test_fraction: 0.15
  num_workers: 2

model:
  backbone: efficientnet_b0
  pretrained: true
  # Dropout is kept active at inference for MC-dropout uncertainty (roadmap item 7),
  # so it must be a real layer in the head, not a functional call.
  head_dropout: 0.3
  freeze_backbone_epochs: 1

train:
  epochs: 12
  batch_size: 64
  optimizer: adamw
  lr: 3.0e-4
  backbone_lr: 3.0e-5
  weight_decay: 1.0e-4
  scheduler: cosine
  label_smoothing: 0.0    # keep at 0: it changes calibration, which is the dependent variable
  amp: true
  # Kaggle kills sessions. Checkpoint every epoch and resume from the last one.
  checkpoint_every_epoch: true
  checkpoint_dir: checkpoints/perception

calibration:
  # Fitted on the validation split by minimising NLL, per Guo et al. (2017).
  # This is the LAB temperature (`lab_fitted_temperature`).
  fit_temperature_on: val
  # A temperature fitted on lab imagery is overconfident under field shift, so a
  # sweep centred on it never reaches underconfidence. PlantDoc is therefore halved:
  # `shift_fit` fits the SHIFT temperature by the same NLL method, and `shift_eval`
  # is what the planners are scored on, so no image both fits the calibration point
  # and is evaluated against it. Half each way: the shift set is small, and the fit
  # needs only one scalar while the evaluation needs a pool per class.
  shift_fit_fraction: 0.5
  # Seed for that split, separate from the training seed so changing one does not
  # silently move the other.
  shift_split_seed: 0
  # Swept afterwards to reproduce the pilot's instrument on a real classifier.
  # Accuracy MUST be invariant across this sweep to 4 d.p.
  temperature_sweep: [0.30, 0.50, 1.00, 2.00, 3.00, 4.00]
  ece_bins: 15
  mc_dropout_samples: 30
  ensemble_members: 5

# Roadmap item 7: temperature scaling, MC-dropout and a deep ensemble compared on
# one axis. Run by experiments/07_uncertainty.py; described in docs/METHOD.md,
# section "2. Perception", subsection "Uncertainty methods".
uncertainty:
  # Every file of this comparison: the extra members' checkpoints and the results.
  # Same run as stage 01, because member 0 is that run's best.pt.
  stage: 07_uncertainty
  # Training seeds of members 1 to 4; member 0 is 01_perception/best.pt (top-level
  # `seed`). A member seed changes the head's initial weights, the order of the
  # training data and the augmentation draws. It never changes the PlantVillage
  # split, which stays drawn with the top-level `seed`, so every member trains,
  # stops and is evaluated on the same images. The backbone starts from the same
  # ImageNet weights in every member, as in any fine-tuned ensemble; that limits
  # member diversity and is stated as a limitation. 1 + len(member_seeds) must equal
  # calibration.ensemble_members.
  member_seeds: [1, 2, 3, 4]
  # MC-dropout draws are seeded so the comparison reproduces exactly.
  mc_dropout_seed: 0
  # Each method is reported raw and after its own temperature is fitted by the same
  # NLL fit as stage 02, so no method is favoured by being the only one fitted.
  # Scored split: the split its temperature is fitted on. shift_eval (what the
  # planners are scored on) pairs with shift_fit; the lab test split, the
  # in-distribution control, pairs with val, as in stage 02.
  fit_splits: {shift_eval: shift_fit, test: val}
  # Stage 02's shift-fitted temperature and shift_eval ECE are recomputed here from
  # member 0. A larger difference stops the stage: it would mean this comparison is
  # not looking at the classifier the rest of the run used.
  consistency_atol: 1.0e-3
  results_file: uncertainty_comparison.json
