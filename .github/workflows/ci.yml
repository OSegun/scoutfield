name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Only the light dependency set. CI's job is to catch interface drift against
      # the pinned pilot, not to train a network — the GPU work belongs on Kaggle and
      # would time out here anyway.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Contract tests
        run: python -m pytest tests/test_pilot_contract.py -v

      - name: Lint
        run: python -m ruff check scoutfield experiments tests
