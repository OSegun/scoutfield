name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # CI's job is to catch interface drift against the pinned pilot, not to train
      # a network — the GPU work belongs on Kaggle and would time out here.
      #
      # torch is still required: the contract test asserting "ECE is minimised at the
      # fitted temperature" calls perception.calibrate.fit_temperature, which
      # optimises log-T with LBFGS. The CPU wheel index keeps that to a ~200 MB
      # download instead of pulling the CUDA build.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,perception,planning,figures]"

      # The whole suite, so env parity, planner, analysis and uncertainty regressions
      # cannot land on main with a green badge.
      #
      # tests/test_app.py skips itself here, deliberately: it needs onnxruntime from
      # the `app` extra, which is not installed, and its export tests build a
      # pretrained backbone, which would download ImageNet weights on every push. It
      # runs locally after `make install-dev`, which installs the `app` extra. `-v`
      # keeps the skip visible in the log rather than absorbed into a dot.
      - name: Tests
        run: python -m pytest -v

      - name: Lint
        run: python -m ruff check scoutfield experiments tests
